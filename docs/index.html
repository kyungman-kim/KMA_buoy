<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">
<title>포항 해양기상부이</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8px; }
  img { max-width: 100%; height: auto; display: block; }
  .info { position: fixed; bottom: 8px; left: 8px; right: 8px; text-align: center; color: #888; font-size: 12px; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
  <img id="plot" alt="포항 부이 시계열">
  <div class="info">📌 두 손가락으로 확대/축소 가능</div>
  <script>
    const ts = Date.now();
    document.getElementById('plot').src = './latest.png?t=' + ts;
  </script>
</body>
</html>
